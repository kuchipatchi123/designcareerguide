<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#F9FAFB;color:#111827}
:root{--blue:#0064FF;--blue-light:#EEF5FF;--W:1200px;--PX:60px}
.nav-btn{padding:8px 16px;border-radius:100px;font-size:13px;font-weight:500;color:#9CA3AF;background:transparent;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
.nav-btn.active{color:#fff;background:var(--blue);font-weight:700}
.screen{display:none;animation:fadeUp .38s ease both}
.screen.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card-hover{transition:transform .2s,box-shadow .2s;cursor:pointer}
.card-hover:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,.08)}
.btn-primary{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;padding:16px 32px;border-radius:16px;font-size:16px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .15s;letter-spacing:-.02em}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,100,255,.35)}
/* Quiz options — equal-height 2-column */
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt-btn{display:flex;flex-direction:column;gap:14px;width:100%;padding:24px 26px;border-radius:20px;background:#fff;border:2px solid #F3F4F6;cursor:pointer;font-family:inherit;text-align:left;transition:all .2s;height:100%}
.opt-btn:hover:not([disabled]){border-color:var(--blue);background:var(--blue-light)}
.opt-btn.selected{border-color:var(--blue);background:var(--blue-light)}
.opt-btn.dimmed{opacity:.35}
.opt-label{width:34px;height:34px;border-radius:10px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:800;color:#9CA3AF;transition:all .2s}
.opt-btn.selected .opt-label{background:var(--blue);color:#fff}
/* Interview sidebar tabs */
.iv-tab{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;border-radius:14px;border:none;background:transparent;font-size:14px;font-weight:500;color:#6B7280;cursor:pointer;transition:all .2s;font-family:inherit;text-align:left;border-left:3px solid transparent}
.iv-tab:hover{background:#F3F4F6;color:#111827}
.progress-track{height:6px;background:#F3F4F6;border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:100px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.blockquote{border-left:3px solid var(--blue);background:var(--blue-light);border-radius:0 14px 14px 0;padding:18px 24px;margin:20px 0;color:#1D4ED8;font-weight:500;line-height:1.85;font-size:14px}
.interview-p{font-size:15px;color:#4B5563;line-height:1.95;margin-bottom:1.1rem}
.interview-p strong{color:#111827;font-weight:700}
/* ECO TABLE */
.eco-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.eco-table{border-radius:20px;overflow:hidden;border:1px solid #F3F4F6;min-width:700px}
.eco-row{display:grid;grid-template-columns:160px 1fr 1fr 1fr 1fr}
.eco-attr{padding:22px 20px;display:flex;align-items:flex-start;border-right:1px solid #F3F4F6}
.eco-cell{padding:20px 16px;border-right:1px solid #F3F4F6;font-size:13px}
.eco-cell:last-child{border-right:none}
.hide-scroll::-webkit-scrollbar{display:none}
.hide-scroll{-ms-overflow-style:none;scrollbar-width:none}
.bar-fill{height:100%;border-radius:100px;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.wrap{max-width:var(--W);margin:0 auto;padding:0 var(--PX)}

/* ── MOBILE ── */
@media (max-width:768px){
  /* NAV */
  .nav-inner{padding:0 20px !important;height:56px !important}
  .nav-logo-text{display:none !important}
  .nav-btn{padding:6px 11px !important;font-size:12px !important}

  /* 공통 화면 컨테이너 */
  .home-screen,.eco-screen,.iv-screen{padding-left:20px !important;padding-right:20px !important;padding-bottom:72px !important}
  .quiz-wrap,.result-wrap{padding-left:20px !important;padding-right:20px !important;padding-bottom:72px !important;max-width:100% !important}

  /* 섹션 제목 */
  .section-h2{font-size:26px !important}

  /* HOME ─ 히어로: 1컬럼 */
  .home-hero{grid-template-columns:1fr !important;gap:40px !important;padding-top:52px !important;padding-bottom:40px !important}
  /* HOME ─ 하단: 1컬럼 */
  .home-bottom{grid-template-columns:1fr !important}

  /* INTERVIEW ─ 사이드바 → 상단 수평 탭 */
  .iv-layout{grid-template-columns:1fr !important;gap:0 !important}
  .iv-sidebar{position:static !important;padding-bottom:24px !important}
  .iv-sidebar-label{display:none !important}
  .iv-tabs-wrap{flex-direction:row !important;overflow-x:auto !important;gap:8px !important;padding-bottom:6px !important}
  .iv-tabs-wrap .iv-tab{flex-shrink:0 !important;width:auto !important;border-left:2px solid transparent !important;border-radius:12px !important;padding:9px 14px !important;font-size:13px !important}
  .iv-tab-sub{display:none !important}

  /* QUIZ ─ 카드 패딩 축소, 옵션 1컬럼 */
  .quiz-card{padding:28px 24px !important}
  .opts-grid{grid-template-columns:1fr !important}

  /* NAV 탭 줄바꿈 방지 */
  #nav-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:1}

  /* HOME 히어로 h1: 40px 최솟값 → 28px */
  .home-hero h1{font-size:clamp(28px,7.5vw,40px) !important}
  /* HOME 히어로 서브텍스트 */
  .home-hero p{font-size:15px !important}

  /* INTERVIEW Q&A 들여쓰기 제거 */
  .qa-body{padding-left:0 !important}

  /* RESULT ─ 1컬럼 */
  .result-grid{grid-template-columns:1fr !important}
  .result-card{padding:32px 28px !important}
  .result-bar-wrap{padding:28px 24px !important}
}
</style>

function quizPickOption(i){
  if(S.sel!==null) return;
  S.sel=i;
  const opt=QUIZ[S.qi].opts[i];
  Object.entries(opt.s).forEach(([k,v])=>{S.scores[k]+=v;});
  renderScreen();
  setTimeout(()=>{
    if(S.qi+1>=QUIZ.length){S.done=true;}
    else{S.qi++;S.sel=null;}
    renderScreen();
  },460);
}
function quizReset(){
  S.qi=0;S.scores={studio:0,cj:0,house:0,samsung:0};S.done=false;S.sel=null;
  renderScreen();
}

function quizHTML(){
  if(S.done) return quizResultHTML();
  const q=QUIZ[S.qi];
  const pct=Math.round((S.qi/QUIZ.length)*100);
  const opts=q.opts.map((opt,i)=>{
    const isSel=S.sel===i; const isDim=S.sel!==null&&!isSel;
    return `<button class="opt-btn${isSel?' selected':''}${isDim?' dimmed':''}" onclick="quizPickOption(${i})" ${S.sel!==null?'disabled':''}>
      <div class="opt-label">${i===0?'A':'B'}</div>
      <span style="font-size:15px;color:${isSel?'#111827':'#374151'};font-weight:${isSel?600:400};line-height:1.6">${opt.t}</span>
    </button>`;
  }).join('');

  return `<div class="quiz-wrap" style="max-width:860px;margin:0 auto;padding:0 60px 100px">
    <div style="padding-top:72px;padding-bottom:44px;text-align:center">
      <p style="font-size:12px;font-weight:700;color:#9CA3AF;letter-spacing:.08em;margin-bottom:14px">PERSONALITY TEST</p>
      <h2 class="section-h2" style="font-size:40px;font-weight:900;letter-spacing:-.04em;margin-bottom:10px">성향 테스트</h2>
      <p style="font-size:16px;color:#9CA3AF">10개 질문으로 나에게 맞는 직군을 찾아드립니다.</p>
    </div>
    <div style="margin-bottom:36px">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:14px;font-weight:600;color:#6B7280">질문 ${S.qi+1} / ${QUIZ.length}</span>
        <span style="font-size:14px;font-weight:700;color:#0064FF">${pct}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="quiz-card" style="background:#fff;border:1.5px solid #F3F4F6;border-radius:24px;padding:44px 48px;margin-bottom:20px">
      <div style="width:40px;height:40px;border-radius:12px;background:#0064FF;display:flex;align-items:center;justify-content:center;margin-bottom:24px">
        <span style="font-size:14px;font-weight:800;color:#fff">Q${S.qi+1}</span>
      </div>
      <h3 style="font-size:22px;font-weight:800;line-height:1.55;letter-spacing:-.03em">${q.q}</h3>
    </div>
    <div class="opts-grid">${opts}</div>
  </div>`;
}

function quizResultHTML(){
  const total=Object.values(S.scores).reduce((a,b)=>a+b,0)||1;
  const pcts={};
  GKEYS.forEach(k=>{pcts[k]=Math.round((S.scores[k]/total)*100);});
  const sorted=[...GKEYS].sort((a,b)=>S.scores[b]-S.scores[a]);
  const winner=sorted[0]; const gw=G[winner];

  const bars=sorted.map((k,i)=>{
    const g=G[k]; const isW=k===winner;
    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:16px">${g.icon}</span>
          <span style="font-size:14px;font-weight:${isW?800:600};color:${isW?'#111827':'#6B7280'}">${g.name}</span>
          ${isW?`<span style="font-size:11px;font-weight:700;color:#0064FF;background:#EEF5FF;padding:2px 8px;border-radius:100px">가장 적합</span>`:''}
        </div>
        <span style="font-size:14px;font-weight:700;color:${isW?g.hex:'#9CA3AF'}">${pcts[k]}%</span>
      </div>
      <div style="height:8px;background:#F3F4F6;border-radius:100px;overflow:hidden">
        <div class="bar-fill" id="bar-${k}" style="width:0;background:${isW?g.hex:'#D1D5DB'}"></div>
      </div>
    </div>`;
  }).join('');

  const tips=gw.tips.map(t=>`
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div style="width:20px;height:20px;border-radius:6px;background:${gw.hex};display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span style="font-size:13px;color:#374151;line-height:1.6">${t}</span>
    </div>`).join('');

  return `<div class="result-wrap" style="max-width:1100px;margin:0 auto;padding:0 60px 100px">
    <div style="padding-top:72px;padding-bottom:48px">
      <p style="font-size:12px;font-weight:700;color:#9CA3AF;letter-spacing:.08em;margin-bottom:14px">TEST RESULT</p>
      <h2 class="section-h2" style="font-size:40px;font-weight:900;letter-spacing:-.04em">성향 분석 결과</h2>
    </div>

    <!-- 2-column: winner card + bar chart -->
    <div class="result-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:stretch;margin-bottom:28px">

      <!-- LEFT: winner card -->
      <div class="result-card" style="background:linear-gradient(145deg,${gw.hex}16,${gw.hex}06);border:2px solid ${gw.hex}24;border-radius:24px;padding:44px 40px;display:flex;flex-direction:column">
        <div style="font-size:56px;margin-bottom:20px">${gw.icon}</div>
        <p style="font-size:11px;font-weight:700;color:${gw.hex};letter-spacing:.08em;margin-bottom:10px">가장 잘 맞는 직군</p>
        <h3 style="font-size:30px;font-weight:900;letter-spacing:-.04em;margin-bottom:4px">${gw.name}</h3>
        <p style="font-size:14px;color:${gw.hex};font-weight:700;margin-bottom:20px">${gw.tag}</p>
        <p style="font-size:14px;color:#6B7280;line-height:1.85;margin-bottom:28px;flex:1">${gw.result}</p>
        <div style="background:#fff;border-radius:16px;padding:22px 26px">
          <p style="font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:.06em;margin-bottom:14px">커리어 준비 체크리스트</p>
          <div style="display:flex;flex-direction:column;gap:12px">${tips}</div>
        </div>
      </div>

      <!-- RIGHT: bar chart -->
      <div class="result-bar-wrap" style="background:#fff;border-radius:24px;padding:44px 40px;border:1px solid #F3F4F6;display:flex;flex-direction:column;justify-content:center">
        <p style="font-size:12px;font-weight:700;color:#9CA3AF;letter-spacing:.08em;margin-bottom:28px">직군 적합도 분석</p>
        ${bars}
      </div>

    </div>

    <button onclick="quizReset()" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:18px;border-radius:16px;background:#F9FAFB;border:1.5px solid #E5E7EB;font-size:15px;font-weight:700;color:#6B7280;cursor:pointer;font-family:inherit">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      다시 테스트하기
    </button>
  </div>`;
}

// ───────────────────────────────────────────
// RENDER
// ───────────────────────────────────────────
function renderScreen(){
  const map={home:homeHTML,eco:ecoHTML,interview:interviewHTML,quiz:quizHTML};
  ['home','eco','interview','quiz'].forEach(t=>{
    document.getElementById('s-'+t).classList.remove('on');
  });
  const el=document.getElementById('s-'+S.tab);
  el.innerHTML=map[S.tab]();
  el.classList.add('on');

  if(S.done){
    requestAnimationFrame(()=>{
      const total=Object.values(S.scores).reduce((a,b)=>a+b,0)||1;
      GKEYS.forEach(k=>{
        const bar=document.getElementById('bar-'+k);
        if(bar){const p=Math.round((S.scores[k]/total)*100);setTimeout(()=>{bar.style.width=p+'%';},60);}
      });
    });
  }
}

go('home');
</script>
</body>
</html>
